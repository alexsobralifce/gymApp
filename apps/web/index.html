    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0A1628" id="meta-theme-color" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ENDORFINAPP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>ENDORFINAPP — A Química do Crescimento</title>
    <!-- ⚡ Define tema ANTES do CSS carregar — evita flash de modo errado -->
    <script>
      !function(){var e=document.documentElement;try{var t=localStorage.getItem('gymapp_theme')||'lime';var m=localStorage.getItem('gymapp_mode')||'auto';var eff='night';if(m==='day'){eff='day'}else if(m==='night'){eff='night'}else{try{if(window.matchMedia('(prefers-color-scheme:dark)').matches)eff='night';else if(window.matchMedia('(prefers-color-scheme:light)').matches)eff='day';else{var h=(new Date).getHours();eff=h>=6&&h<18?'day':'night'}}catch(o){var h=(new Date).getHours();eff=h>=6&&h<18?'day':'night'}}e.setAttribute('data-theme',t);e.setAttribute('data-mode',eff)}catch(o){e.setAttribute('data-theme','lime');e.setAttribute('data-mode','night')}}();
    </script>
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[SW] Registrado:', reg.scope)
        }).catch(function(err) {
          console.warn('[SW] Falha no registro:', err)
        })
      }
    </script>
  </body>
</html>
