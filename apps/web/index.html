<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" id="meta-color-scheme" />
    <meta name="theme-color" content="#0A1628" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ENDORFINAPP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="meta-status-bar" />
    <meta name="description" content="ENDORFINAPP — A Química do Crescimento. Gestão de treinos, evolução e rede social fitness." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>ENDORFINAPP — A Química do Crescimento</title>
    <!-- ⚡ Tema síncrono no <head> + bootstrap debug para o painel Debug -->
    <script>
      !function(){
        var e=document.documentElement;
        var hour=(new Date).getHours();
        var boot={
          storageTheme:null,
          storageMode:null,
          resolvedTheme:'lime',
          resolvedEff:'night',
          isDay:false,
          matchMediaDark:null,
          matchMediaLight:null,
          hour:hour,
          error:null,
          at:new Date().toISOString()
        };
        try{
          var t=localStorage.getItem('gymapp_theme')||'lime';
          boot.storageTheme=localStorage.getItem('gymapp_theme');
          if(t==='orange')t='red';
          var m=localStorage.getItem('gymapp_mode')||'auto';
          boot.storageMode=localStorage.getItem('gymapp_mode');
          // Auto = só horário 06h-18h (NÃO segue dark do SO — Android ficava sempre night)
          try{
            boot.matchMediaDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
            boot.matchMediaLight=window.matchMedia('(prefers-color-scheme:light)').matches;
          }catch(o){boot.error='matchMedia:'+String(o&&o.message||o)}
          var eff='night';
          if(m==='day'){eff='day'}
          else if(m==='night'){eff='night'}
          else{eff=hour>=6&&hour<18?'day':'night'}
          e.setAttribute('data-theme',t);
          e.setAttribute('data-mode',eff);
          boot.resolvedTheme=t;
          boot.resolvedEff=eff;
          boot.isDay=eff==='day';
          var isDay=boot.isDay;
          var cs=document.getElementById('meta-color-scheme');
          /* only light = opt-out Chrome Auto Dark (mesmo com prefers-color-scheme:dark) */
          if(cs)cs.setAttribute('content',isDay?'only light':'dark');
          var tc=document.getElementById('meta-theme-color');
          if(tc){
            var surfaces={lime:{day:'#FFFFFF',night:'#0A1628'},red:{day:'#FFFFFF',night:'#0F0F0F'},violet:{day:'#FFFFFF',night:'#0C0C0E'}};
            var pack=surfaces[t]||surfaces.lime;
            tc.setAttribute('content',isDay?pack.day:pack.night);
          }
          var sb=document.getElementById('meta-status-bar');
          if(sb)sb.setAttribute('content',isDay?'default':'black-translucent');
          console.log('[GymApp:THEME-BOOT]',boot);
        }catch(o){
          boot.error=String(o&&o.message||o);
          e.setAttribute('data-theme','lime');
          e.setAttribute('data-mode','night');
          console.warn('[GymApp:THEME-BOOT] fallback night',boot);
        }
        try{
          window.__themeBootstrap=boot;
          sessionStorage.setItem('__theme_bootstrap',JSON.stringify(boot));
        }catch(o2){}
      }();
    </script>
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[SW] Registrado:', reg.scope)
        }).catch(function(err) {
          console.warn('[SW] Falha no registro:', err)
        })
      }
    </script>
  </body>
</html>
