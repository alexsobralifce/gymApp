name: Curadoria semanal do blog

# Toda segunda-feira (08h em Brasília) o robô lê os feeds, escreve 2 "Leituras da semana" (curtas, noindex)
# e as envia para a API do blog. O painel root (Publicações do Blog) controla publicar/despublicar, e a API
# agenda o redeploy do site. Travas: nota de utilidade, texto sem frases copiadas, sem termos de risco.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantidade de curadorias'
        default: '2'
      modo:
        description: 'publicar (vai ao ar) ou rascunho (aprovar no painel root)'
        type: choice
        options: [publicar, rascunho]
        default: publicar

jobs:
  curadoria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testes do robô
        working-directory: apps/web
        run: npx vitest run src/curadoria.test.ts
      - name: Gerar e enviar curadorias
        working-directory: apps/web
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_API_URL: https://api-production-3360.up.railway.app
          BLOG_BOT_TOKEN: ${{ secrets.BLOG_BOT_TOKEN }}
          CURADORIA_PUBLICAR: ${{ (inputs.modo || 'publicar') == 'publicar' && '1' || '0' }}
        run: node scripts/curadoria/curadoria.mjs --quantidade=${{ inputs.quantidade || 2 }}
