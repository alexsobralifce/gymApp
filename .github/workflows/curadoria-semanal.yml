name: Curadoria semanal do blog

# Toda segunda-feira (08h em Brasília) o robô lê os feeds, escreve 2 "Leituras da semana" (curtas,
# noindex) e as publica direto em main; o Railway faz o deploy. Travas: nota de utilidade, texto sem
# frases copiadas e sem termos de risco (suplemento, dose, promessa). Se o push direto for bloqueado
# (branch protegida), abre um Pull Request. Use modo "pr" para revisar antes de publicar.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantidade de curadorias'
        default: '2'
      modo:
        description: 'direto (publica em main) ou pr (abre Pull Request para revisão)'
        type: choice
        options: [direto, pr]
        default: direto

permissions:
  contents: write
  pull-requests: write

jobs:
  curadoria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gerar curadorias
        working-directory: apps/web
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/curadoria/curadoria.mjs --quantidade=${{ inputs.quantidade || 2 }}
      - name: Validar os artigos gerados
        working-directory: apps/web
        run: npx vitest run src/lib/blog.test.ts src/curadoria.test.ts
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo || 'direto' }}
        run: |
          if [ -z "$(git status --porcelain apps/web/content)" ]; then echo "Nada novo."; exit 0; fi
          git config user.name "Robô de curadoria"
          git config user.email "curadoria@users.noreply.github.com"
          data=$(date +%Y-%m-%d)
          git add apps/web/content
          git commit -m "feat(blog): leituras da semana $data"
          if [ "$MODO" = "direto" ]; then
            git pull --rebase origin main && git push origin HEAD:main && { echo "Publicado direto em main."; exit 0; }
            echo "Push direto falhou (branch protegida?). Abrindo Pull Request."
          fi
          ramo="curadoria/$data"
          git checkout -b "$ramo"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Leituras da semana $(date +%d/%m/%Y)" \
            --body "Gerado automaticamente. Revise antes do merge (o merge publica): texto original, link da fonte correto, sem conselho médico nem promessa."
