services:
  postgres:
    image: postgres:18-alpine
    restart: always
    env_file: ./env/postgres.env
    volumes:
      - ../data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../data/redis:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    env_file: ./env/api.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../data/uploads:/app/apps/api/public/uploads
      - ../data/exercises:/app/apps/api/public/exercises
    networks:
      - default
      - edge

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: https://api.endorfinapp.com.br
        VITE_SITE_URL: https://www.endorfinapp.com.br
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_MP_PUBLIC_KEY: ${VITE_MP_PUBLIC_KEY}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    restart: always
    networks:
      - default
      - edge

# Portas 80 e 443 ficam com o edge-caddy (projeto /srv/edge), que encaminha
# o tráfego para src-web-1 e src-api-1 pela rede externa "edge".
networks:
  edge:
    external: true
    name: edge
